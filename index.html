<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSYCHOPATHE-E · Photographe et boutique</title>
<meta name="description" content="Photographe professionnel à Abidjan : shootings studio, extérieur, rue, mode et événements. Boutique de mode homme, chapeaux, chaussures et créations crochetées. Paiement à la livraison.">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Monde unique, sombre : noir profond, anthracite, blanc cassé, accent bronze doré. Mise en page éditoriale, grilles asymétriques. */
  --noir:#0b0b0c; --anthracite:#161618; --carte:#1e1e21; --ligne:#2f2e31;
  --blanc:#f1ece2; --gris:#a7a196; --or:#c9a15b; --or-fonce:#8f6f37;
  --ok:#7fb48a; --warn:#d8b25a; --ko:#d77a6c; --info:#8fb2d6;
  --display:"Bodoni Moda", "Didot", Georgia, serif;
  --body:"Manrope", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--noir);color:var(--blanc);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--or)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(38px,8vw,84px)}
h2{font-size:clamp(28px,5vw,44px)}
h3{font-size:22px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--or);font-weight:600}
.muted{color:var(--gris)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}

/* En-tête */
header{position:sticky;top:0;z-index:20;background:rgba(11,11,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ligne)}
.bar{display:flex;align-items:center;gap:16px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--blanc);font-family:var(--display);font-size:22px;letter-spacing:.06em;white-space:nowrap}
.logo svg{flex:none}
nav.main{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{color:var(--gris);text-decoration:none;padding:8px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
nav.main a:hover{color:var(--blanc)}
nav.main a.on{color:var(--noir);background:var(--or)}
.icons{display:flex;gap:6px}
.icobtn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:999px;border:1px solid var(--ligne);color:var(--blanc);text-decoration:none;background:transparent}
.icobtn:hover{border-color:var(--or)}
.badge[hidden]{display:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--or);color:var(--noir);font-size:11px;font-weight:700;display:grid;place-items:center}
@media (max-width:860px){
  .bar{flex-wrap:wrap;padding-top:8px}
  nav.main{order:3;width:100%;margin:0 -4px 6px}
  .icons{margin-left:auto}
}

/* Boutons et formulaires */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--or);background:var(--or);color:var(--noir);padding:11px 20px;border-radius:999px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.btn:hover{background:#d8b273}
.btn.ghost{background:transparent;color:var(--blanc);border-color:var(--ligne)}
.btn.ghost:hover{border-color:var(--or);color:var(--or)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.wa{background:#25d366;border-color:#25d366;color:#06301a}
.btn.danger{background:transparent;border-color:#5a2f2a;color:var(--ko)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:grid;gap:6px;font-size:13px;color:var(--gris)}
label.f span b{color:var(--or);font-weight:500}
input.i,select.i,textarea.i{width:100%;background:var(--anthracite);border:1px solid var(--ligne);border-radius:10px;padding:11px 12px;color:var(--blanc)}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--or);outline:none}
textarea.i{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.err{color:var(--ko);font-size:13px;min-height:1em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ligne);background:transparent;color:var(--gris);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px}
.chip:hover{color:var(--blanc);border-color:var(--gris)}
.chip.on{background:var(--blanc);color:var(--noir);border-color:var(--blanc)}

section.view{padding:40px 0 80px}
section.view[hidden]{display:none}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:28px}
.head p{max-width:60ch;margin:8px 0 0}

/* Accueil */
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding:36px 0 56px}
.hero .ph{aspect-ratio:4/5;border-radius:4px;overflow:hidden;position:relative}
.hero .ph img{width:100%;height:100%;object-fit:cover}
.hero .ph .cap{position:absolute;left:14px;bottom:12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--blanc);opacity:.8}
.hero p.lead{font-size:17px;max-width:46ch;color:var(--gris);margin:20px 0 28px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.exif{display:flex;gap:18px;margin-top:30px;font-size:12px;color:var(--gris);flex-wrap:wrap}
.exif b{color:var(--blanc);font-weight:500;display:block;font-size:14px}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero .ph{aspect-ratio:3/2}}
.band{border-top:1px solid var(--ligne);padding:56px 0}
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:170px;gap:8px}
.mosaic .m{overflow:hidden;border-radius:3px;cursor:pointer;position:relative;background:var(--anthracite);border:0;padding:0}
.mosaic .m img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.mosaic .m:hover img{transform:scale(1.04)}
.mosaic .m.t{grid-row:span 2}
.mosaic .m.w{grid-column:span 2}
@media (max-width:700px){.mosaic{grid-template-columns:repeat(2,1fr);grid-auto-rows:140px}}
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;align-items:start}
.about blockquote{font-family:var(--display);font-style:italic;font-size:26px;line-height:1.3;margin:0;color:var(--blanc)}
@media (max-width:760px){.about{grid-template-columns:1fr}}
.vendlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.vcard{border:1px solid var(--ligne);border-radius:14px;padding:18px;display:grid;gap:10px;background:var(--anthracite)}
.vcard .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--noir);background:var(--or)}
.avis{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.avis .a{border-left:2px solid var(--or);padding:4px 0 4px 16px}
.tag{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px dashed var(--gris);color:var(--gris);padding:2px 8px;border-radius:999px}

/* Galerie */
.gal{columns:3 260px;column-gap:10px}
.gal .g{break-inside:avoid;margin:0 0 10px;position:relative;cursor:pointer;border:0;padding:0;background:none;width:100%;display:block}
.gal .g img{width:100%;border-radius:3px}
.gal .g .lbl{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:left;font-size:13px;color:var(--blanc);opacity:0;transition:opacity .3s;border-radius:0 0 3px 3px}
.gal .g:hover .lbl,.gal .g:focus-visible .lbl{opacity:1}
@media (hover:none){.gal .g .lbl{opacity:1}}

/* Prestations */
.prest{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{border:1px solid var(--ligne);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;background:var(--anthracite)}
.pcard img{aspect-ratio:16/10;object-fit:cover;width:100%}
.pcard .b{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.pcard .prix{font-family:var(--display);font-size:24px;color:var(--or)}
.pcard ul{margin:0;padding-left:18px;color:var(--gris);font-size:14px}
.pcard .b .btn{margin-top:auto;align-self:flex-start}

/* Boutique */
.shop{display:grid;grid-template-columns:230px 1fr;gap:28px}
.filters{display:grid;gap:22px;align-content:start;position:sticky;top:90px}
.filters h4{margin:0 0 10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--or);font-weight:600}
.catlist{display:grid;gap:2px}
.catlist button{background:none;border:0;color:var(--gris);text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between}
.catlist button:hover{color:var(--blanc);background:var(--anthracite)}
.catlist button.on{color:var(--blanc);background:var(--carte)}
input[type=range]{width:100%;accent-color:var(--or)}
@media (max-width:820px){.shop{grid-template-columns:1fr}.filters{position:static}.catlist{display:flex;flex-wrap:wrap;gap:6px}.catlist button{border:1px solid var(--ligne);border-radius:999px;padding:6px 12px}}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.prod{position:relative;display:flex;flex-direction:column;gap:8px}
.prod .im{position:relative;aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:var(--anthracite);cursor:pointer;border:0;padding:0}
.prod .im img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.prod .im:hover img{transform:scale(1.03)}
.prod .fav{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(11,11,12,.7);color:var(--blanc);display:grid;place-items:center;cursor:pointer;z-index:2}
.prod .fav.on{color:var(--or)}
.prod .flag{position:absolute;top:10px;left:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--blanc);color:var(--noir);font-weight:700;z-index:2}
.prod .flag.promo{background:var(--ko);color:#2a0d08}
.prod .nm{font-weight:600;font-size:15px;line-height:1.3}
.prod .vd{font-size:12px;color:var(--gris)}
.prod .pr{display:flex;gap:8px;align-items:baseline}
.prod .pr b{color:var(--or);font-weight:600}
.prod .pr s{color:var(--gris);font-size:13px}
.empty{border:1px dashed var(--ligne);border-radius:14px;padding:40px;text-align:center;color:var(--gris)}

/* Panier */
.cartgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:start}
@media (max-width:900px){.cartgrid{grid-template-columns:1fr}}
.vgroup{border:1px solid var(--ligne);border-radius:14px;margin-bottom:16px;overflow:hidden}
.vgroup .vh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--anthracite);border-bottom:1px solid var(--ligne);font-size:13px}
.vgroup .vh b{font-weight:600;color:var(--blanc)}
.line{display:grid;grid-template-columns:72px 1fr auto;gap:14px;padding:14px 16px;border-bottom:1px solid var(--ligne);align-items:center}
.line:last-child{border-bottom:0}
.line img{width:72px;height:88px;object-fit:cover;border-radius:3px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--ligne);border-radius:999px}
.qty button{background:none;border:0;width:32px;height:32px;cursor:pointer;color:var(--blanc)}
.qty span{min-width:24px;text-align:center}
.linkbtn{background:none;border:0;color:var(--gris);cursor:pointer;text-decoration:underline;font-size:12px;padding:0}
.summary{border:1px solid var(--ligne);border-radius:14px;padding:20px;background:var(--anthracite);position:sticky;top:90px;display:grid;gap:14px}
.row{display:flex;justify-content:space-between;gap:10px}
.total{font-family:var(--display);font-size:28px;color:var(--or)}
.checkout{border:1px solid var(--ligne);border-radius:14px;padding:22px;margin-top:8px;display:grid;gap:14px}
.pay{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--or-fonce);background:rgba(201,161,91,.08);font-size:14px}

/* Confirmation */
.conf{max-width:760px;margin:0 auto;display:grid;gap:18px}
.sendcard{border:1px solid var(--ligne);border-radius:14px;padding:18px;display:grid;gap:12px;background:var(--anthracite)}
.sendcard pre{white-space:pre-wrap;font-family:var(--body);font-size:13px;color:var(--gris);background:var(--noir);border-radius:10px;padding:12px;margin:0;max-height:220px;overflow:auto}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* Tableaux de bord */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--ligne);margin-bottom:22px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--gris);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--blanc);border-color:var(--or)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:26px}
.tile{border:1px solid var(--ligne);border-radius:12px;padding:16px;background:var(--anthracite)}
.tile .v{font-family:var(--display);font-size:32px;line-height:1.1;margin-top:4px}
.tile .k{font-size:12px;color:var(--gris)}
.ocard{border:1px solid var(--ligne);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;gap:10px;background:var(--anthracite);border-left-width:3px}
.ocard .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.ocard .it{font-size:14px}
.ocard .meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 16px;font-size:13px;color:var(--gris)}
.ocard .meta b{color:var(--blanc);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-nouvelle{color:var(--info);background:rgba(143,178,214,.12)} .b-nouvelle{border-left-color:var(--info)}
.s-acceptee,.s-preparation,.s-expediee{color:var(--warn);background:rgba(216,178,90,.12)} .b-acceptee,.b-preparation,.b-expediee{border-left-color:var(--warn)}
.s-livree,.s-confirmee,.s-actif{color:var(--ok);background:rgba(127,180,138,.12)} .b-livree,.b-confirmee{border-left-color:var(--ok)}
.s-refusee,.s-annulee,.s-suspendu{color:var(--ko);background:rgba(215,122,108,.12)} .b-refusee,.b-annulee{border-left-color:var(--ko)}
.s-attente,.s-autre-date{color:var(--or);background:rgba(201,161,91,.12)} .b-attente,.b-autre-date{border-left-color:var(--or)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--ligne)}
.tbl td{padding:10px;border-bottom:1px solid var(--ligne);vertical-align:middle}
.tblwrap{overflow-x:auto;border:1px solid var(--ligne);border-radius:12px}
.thumb{width:44px;height:54px;object-fit:cover;border-radius:3px}
.panel{border:1px solid var(--ligne);border-radius:14px;padding:20px;display:grid;gap:14px;background:var(--anthracite);margin-bottom:22px}
.demo{font-size:12px;color:var(--gris);border:1px dashed var(--ligne);border-radius:10px;padding:10px 14px;margin-bottom:20px}

/* Fenêtres */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:16px;overflow:auto}
.ov[hidden]{display:none}
.modal{background:var(--anthracite);border:1px solid var(--ligne);border-radius:16px;width:min(920px,100%);max-height:calc(100% - 20px);overflow:auto;position:relative}
.modal .x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--ligne);background:var(--noir);color:var(--blanc);cursor:pointer;z-index:3;font-size:18px}
.pmodal{display:grid;grid-template-columns:1fr 1fr}
.pmodal .im img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/5}
.pmodal .b{padding:28px;display:grid;gap:14px;align-content:start}
@media (max-width:700px){.pmodal{grid-template-columns:1fr}.pmodal .im img{aspect-ratio:1}}
.light{position:relative;width:min(1000px,100%);display:grid;gap:10px;justify-items:center}
.light img{max-height:78vh;width:auto;border-radius:3px}
.light .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--ligne);background:rgba(11,11,12,.7);color:var(--blanc);cursor:pointer;font-size:20px}
.light .prev{left:6px}.light .next{right:6px}
.light .x{position:absolute;top:-6px;right:6px;width:40px;height:40px;border-radius:50%;border:1px solid var(--ligne);background:var(--noir);color:var(--blanc);cursor:pointer;font-size:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--blanc);color:var(--noir);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast[hidden]{display:none}
footer{border-top:1px solid var(--ligne);padding:40px 0;color:var(--gris);font-size:14px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}
@media (max-width:700px){footer .cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Ajouts version Firebase ---- */
#app{min-height:60vh}
.authbox{max-width:520px;margin:0 auto;display:grid;gap:18px}
.notice{border:1px solid var(--or-fonce);background:rgba(201,161,91,.08);border-radius:12px;padding:14px 16px;font-size:14px}
.notice.ko{border-color:#5a2f2a;background:rgba(215,122,108,.08)}
.loading{padding:80px 0;text-align:center;color:var(--gris)}
.thumbs{display:flex;gap:8px;padding:10px;flex-wrap:wrap}
.thumbs button{border:1px solid var(--ligne);padding:0;background:none;border-radius:4px;cursor:pointer;width:56px;height:70px;overflow:hidden}
.thumbs button.on{border-color:var(--or)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.stars{color:var(--or);letter-spacing:2px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gris)}
.setup{max-width:640px;margin:60px auto;padding:0 20px;display:grid;gap:14px}
.setup code{background:var(--anthracite);padding:2px 6px;border-radius:4px}
.catedit{display:flex;gap:8px;align-items:center}
.catedit input{flex:1}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="logo" href="#accueil" aria-label="PSYCHOPATHE-E, accueil">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13.5" fill="none" stroke="#c9a15b" stroke-width="1.2"/><g fill="none" stroke="#c9a15b" stroke-width="1.2"><path d="M15 1.5 L21 13"/><path d="M27.5 10 L16 17"/><path d="M24 25.5 L13 19.5"/><path d="M7 26 L10.5 14"/><path d="M2.5 11 L15 8.5"/></g></svg>
      PSYCHOPATHE-E
    </a>
    <nav class="main" aria-label="Navigation principale">
      <a href="#accueil" data-nav="accueil">Accueil</a>
      <a href="#galerie" data-nav="galerie">Galerie</a>
      <a href="#prestations" data-nav="prestations">Prestations</a>
      <a href="#boutique" data-nav="boutique">Boutique</a>
      <a href="#vendeur" data-nav="vendeur" id="navVendeur" hidden>Ma boutique</a>
      <a href="#admin" data-nav="admin" id="navAdmin" hidden>Administration</a>
      <a href="#compte" data-nav="compte" id="navCompte">Connexion</a>

  for (const l of lines) { const p = P(l.pid), q = lines.filter(x => x.pid === l.pid).reduce((s, x) => s + x.qty, 0); if (p.stock < q) { $("#coErr").textContent = "Stock insuffisant pour « " + p.nom + " ». Réduisez la quantité."; return; } if (!S.vendeurs.some(v => v.id === p.vid)) { $("#coErr").textContent = "« " + p.nom + " » n'est plus disponible. Retirez-le du panier."; return; } }
  const ref = "CMD-" + Date.now().toString(36).toUpperCase().slice(-5) + rid(2);
  const items = lines.map(l => { const p = P(l.pid); return { pid: p.id, nom: p.nom, ref: p.ref || "", prix: p.prix, qty: l.qty, taille: l.taille, couleur: l.couleur, vid: p.vid }; });
  const vids = [...new Set(items.map(i => i.vid))];
  const total = items.reduce((a, i) => a + i.prix * i.qty, 0);
  const uid = S.user ? S.user.uid : null;
  btn.disabled = true; btn.textContent = "Envoi en cours…";
  try {
    const b = writeBatch(db);
    b.set(doc(db, "commandes", ref), { ref, clientUid: uid, client: c, items, vendeurs: vids, total, statut: "nouvelle", createdAt: serverTimestamp() });
    vids.forEach(vid => { const its = items.filter(i => i.vid === vid); b.set(doc(db, "sousCommandes", ref + "_" + vid), { ref, vid, boutique: V(vid).boutique, clientUid: uid, client: c, items: its, total: its.reduce((a, i) => a + i.prix * i.qty, 0), statut: "nouvelle", createdAt: serverTimestamp(), updatedAt: serverTimestamp() }); });
    await b.commit();
    if (S.user) { try { await updateDoc(doc(db, "users", S.user.uid), { tel: c.tel, commune: c.commune, quartier: c.quartier, adresse: c.adresse }); } catch (e) { /* profil facultatif */ } }
  } catch (e) { console.error(e); btn.disabled = false; btn.textContent = "Réessayer"; $("#coErr").textContent = "La commande n'a pas pu être enregistrée : " + errMsg(e); return; }
  const parts = vids.map(vid => { const v = V(vid), its = items.filter(i => i.vid === vid); return { vid, boutique: v.boutique, wa: waNum(v.wa), email: v.email || "", text: orderText(ref, c, vid, its), mailed: false }; });
  const last = { ref, client: c, total, parts };
  try { sessionStorage.setItem("psy-last", JSON.stringify(last)); } catch (e) { /* ignoré */ }
  S.lastOrder = last; S.cart = []; saveCart();
  location.hash = "#confirmation";
  // E-mails automatiques (vendeurs + propriétaire)
  const owner = contact().email;
  const res = await Promise.all(parts.map(p => sendMail(p.email, "Nouvelle commande " + ref, p.text)));
  res.forEach((ok, i) => parts[i].mailed = ok);
  if (owner && !parts.some(p => p.email === owner)) sendMail(owner, "Commande " + ref + " sur " + SITE.nom, "Nouvelle commande " + ref + " de " + c.nom + " (" + c.tel + "), total " + fcfa(total) + ".\n\n" + parts.map(p => p.text).join("\n\n----------\n\n"));
  try { sessionStorage.setItem("psy-last", JSON.stringify(last)); } catch (e) { /* ignoré */ }
  if (current() === "confirmation") render();
}

async function changerStatut(sid, st2) {
  const ref = doc(db, "sousCommandes", sid);
  if (st2 === "acceptee") {
    await runTransaction(db, async tx => {
      const s = await tx.get(ref); if (!s.exists()) throw new Error("Commande introuvable.");
      const d = s.data(); if (d.statut !== "nouvelle") throw new Error("Cette commande a déjà été traitée.");
      const need = {}; d.items.forEach(i => need[i.pid] = (need[i.pid] || 0) + i.qty);
      const snaps = []; for (const pid of Object.keys(need)) { const pr = doc(db, "produits", pid); snaps.push([pr, await tx.get(pr), need[pid], pid]); }
      for (const [, ps, q] of snaps) if (ps.exists() && (ps.data().stock || 0) < q) throw new Error("Stock insuffisant pour « " + ps.data().nom + " ». Ajoutez du stock ou refusez la commande.");
      for (const [pr, ps, q] of snaps) if (ps.exists()) tx.update(pr, { stock: increment(-q), ventes: increment(q) });
      tx.update(ref, { statut: "acceptee", updatedAt: serverTimestamp() });
    });
  } else await updateDoc(ref, { statut: st2, updatedAt: serverTimestamp() });
  journal("commande." + st2, sid);
}

        if (!confirmTwice(t, "Confirmer l'annulation")) break;
        const subs = S.aSous.filter(s => s.ref === id), b = writeBatch(db);
        subs.forEach(s => { if (["acceptee", "preparation", "expediee"].includes(s.statut)) s.items.forEach(i => { if (P(i.pid)) b.update(doc(db, "produits", i.pid), { stock: increment(i.qty), ventes: increment(-i.qty) }); }); if (!["livree", "refusee", "annulee"].includes(s.statut)) b.update(doc(db, "sousCommandes", s.id), { statut: "annulee", updatedAt: serverTimestamp() }); });
        b.update(doc(db, "commandes", id), { statut: "annulee" }); await b.commit(); journal("commande.annulee", id); toast("Commande annulée"); break;
      }
      case "resa": {
        const [rId, st2] = id.split("|"), r = S.aResa.find(x => x.id === rId), upd = { statut: st2, updatedAt: serverTimestamp() };
        if (st2 === "autre-date") { const d = val("nd-" + rId); if (!d) { toast("Choisissez d'abord la nouvelle date"); break; } upd.proposee = d; upd.heureProposee = val("nh-" + rId); }
        await updateDoc(doc(db, "reservations", rId), upd); journal("reservation." + st2, r.nom + " " + r.date);
        const r2 = Object.assign({}, r, upd); if (r.email) sendMail(r.email, "Votre réservation " + SITE.nom, resaMsg(r2));
        toast({ confirmee: "Réservation confirmée", refusee: "Réservation refusée", "autre-date": "Nouvelle date proposée" }[st2] + (r.email ? " · e-mail envoyé au client si EmailJS est configuré" : ""));
        break;
      }
      case "vst": { const [vid, st2] = id.split("|"); await updateDoc(doc(db, "vendeurs", vid), { statut: st2, updatedAt: serverTimestamp() }); const v = S.aVend.find(x => x.id === vid); journal("vendeur." + st2, v ? v.boutique : vid);
        if (v && v.email) sendMail(v.email, "Votre boutique sur " + SITE.nom, st2 === "actif" ? "Bonne nouvelle : votre boutique « " + v.boutique + " » est validée. Connectez-vous pour ajouter vos produits." : st2 === "refuse" ? "Votre demande pour la boutique « " + v.boutique + " » n'a pas été retenue." : "Votre boutique « " + v.boutique + " » a été suspendue. Contactez l'administrateur.");
        toast({ actif: "Vendeur activé", refuse: "Demande refusée", suspendu: "Vendeur suspendu" }[st2]); break; }
      case "usus": { const u = S.aUsers.find(x => x.id === id); await updateDoc(doc(db, "users", id), { suspendu: !u.suspendu }); journal(u.suspendu ? "utilisateur.reactive" : "utilisateur.suspendu", u.email); break; }
      case "udel": { if (!confirmTwice(t)) break; const u = S.aUsers.find(x => x.id === id); await deleteDoc(doc(db, "users", id)); journal("utilisateur.supprime", u ? u.email : id); toast("Profil supprimé"); break; }
      case "ved": { const p = P(id); await updateDoc(doc(db, "produits", id), { vedette: !p.vedette }); break; }
      case "gdel": { if (!confirmTwice(t)) break; const b = writeBatch(db); b.delete(doc(db, "galerie", id)); b.delete(doc(db, "galerie_hd", id)); await b.commit(); journal("galerie.supprime", id); break; }
      case "gved": { const b = writeBatch(db); S.galerie.filter(g => g.vedette).forEach(g => b.update(doc(db, "galerie", g.id), { vedette: false })); b.update(doc(db, "galerie", id), { vedette: true }); await b.commit(); toast("Image d'accueil choisie"); break; }
      case "xedit": xEdit = id; renderAdminForm(); window.scrollTo({ top: $("#aForm").offsetTop - 90, behavior: "smooth" }); break;
      case "xcancel": xEdit = null; renderAdminForm(); break;
      case "xdel": { if (!confirmTwice(t)) break; await deleteDoc(doc(db, "prestations", id)); journal("prestation.supprimee", id); break; }
      case "apub": await updateDoc(doc(db, "avis", id), { statut: "publie" }); break;
      case "aunpub": await updateDoc(doc(db, "avis", id), { statut: "attente" }); break;
      case "adel": if (!confirmTwice(t)) break; await deleteDoc(doc(db, "avis", id)); break;
      case "catadd": { const div = document.createElement("div"); div.className = "catedit"; div.innerHTML = '<input class="i" data-cid="" placeholder="Nouvelle catégorie" aria-label="Nom de la catégorie"><button type="button" class="btn danger sm" data-act="catdel">Retirer</button>'; $("#catEdit").appendChild(div); div.querySelector("input").focus(); break; }
      case "catdel": t.closest(".catedit").remove(); break;
    }
  } catch (err) { console.error(err); t.disabled = false; toast(errMsg(err)); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); if (!$("#lb").hidden) { if (e.key === "ArrowLeft") { lbI = (lbI - 1 + lbList.length) % lbList.length; drawLB(); } if (e.key === "ArrowRight") { lbI = (lbI + 1) % lbList.length; drawLB(); } } });
document.addEventListener("input", e => {
  const f = e.target.closest("form"); if (f) { const er = f.querySelector(".err"); if (er) er.textContent = ""; }
  if (e.target.id === "aq") { aQ = e.target.value; renderAdminList(); }
});
document.addEventListener("change", e => { if (e.target.id === "av") { aV = e.target.value; renderAdminList(); } if (e.target.id === "adu") { aDu = e.target.value; renderAdminList(); } });

/* =================== Formulaires =================== */
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, btn = f.querySelector('button[type="submit"]'), errEl = f.querySelector(".err");
  const fail = m => { if (errEl) errEl.textContent = m; if (btn) btn.disabled = false; };
  try {
    switch (f.id) {
      case "coForm": await passerCommande(btn); break;
      case "bkForm": {
        const r = { nom: val("bk-n"), tel: val("bk-t"), email: val("bk-e"), type: val("bk-ty"), date: val("bk-d"), heure: val("bk-h"), lieu: val("bk-l"), desc: val("bk-x") };
        const err = !r.nom ? "Indiquez votre nom et prénom." : !telOk(r.tel) ? "Indiquez un numéro de téléphone valide." : r.email && !mailOk(r.email) ? "L'adresse e-mail n'est pas valide." : !r.type ? "Choisissez un type de shooting." : !r.date || r.date <= today() ? "Choisissez une date à partir de demain." : !r.heure ? "Indiquez une heure." : !r.lieu ? "Indiquez le lieu de la séance." : "";
        if (err) return fail(err);
        btn.disabled = true; btn.textContent = "Envoi…";
        await addDoc(collection(db, "reservations"), Object.assign({}, r, { statut: "attente", clientUid: S.user ? S.user.uid : null, createdAt: serverTimestamp() }));
        const c = contact(), txt = "Bonjour, je souhaite réserver : " + r.type + "\nNom : " + r.nom + " (" + r.tel + ")\nDate : " + fdate(r.date) + " à " + r.heure + "\nLieu : " + r.lieu + (r.desc ? "\n" + r.desc : "");
        sendMail(c.email, "Nouvelle demande de shooting", txt);
        $("#modal").innerHTML = '<button class="x" data-act="close" aria-label="Fermer">×</button><div style="padding:32px;display:grid;gap:14px"><div class="eyebrow">Demande envoyée</div><h2 style="font-size:32px">Merci, ' + esc(r.nom.split(" ")[0]) + '.</h2><p class="muted" style="margin:0">Votre demande de <b style="color:var(--blanc)">' + esc(r.type) + '</b> pour le ' + esc(fdate(r.date)) + ' à ' + esc(r.heure) + ' est en attente. Le photographe vous répondra pour confirmer ou proposer une autre date.</p><div class="acts">' + (c.whatsapp ? '<a class="btn wa" href="https://wa.me/' + esc(waNum(c.whatsapp)) + '?text=' + encodeURIComponent(txt) + '" target="_blank" rel="noopener">Prévenir le photographe sur WhatsApp</a>' : "") + '<button class="btn ghost" data-act="close">Fermer</button></div></div>';
        break;
      }
      case "avForm": {
        const a = { nom: val("av-n"), sujet: val("av-s"), note: Math.min(5, Math.max(1, +val("av-note") || 5)), texte: val("av-t") };
        if (!a.nom) return fail("Indiquez votre nom."); if (a.texte.length < 10) return fail("Écrivez au moins quelques mots.");
        btn.disabled = true; await addDoc(collection(db, "avis"), Object.assign({}, a, { statut: "attente", uid: S.user ? S.user.uid : null, createdAt: serverTimestamp() }));
        closeModal(); toast("Merci ! Votre avis sera publié après relecture."); break;
      }
      case "loginForm": {
        const em = val("lg-e"), pw = $("#lg-p").value; if (!mailOk(em) || !pw) return fail("Indiquez votre e-mail et votre mot de passe.");
        btn.disabled = true; await signInWithEmailAndPassword(auth, em, pw); toast("Connecté"); location.hash = SITE.adminEmails.includes(em.toLowerCase()) ? "#admin" : "#compte"; break;
      }
      case "signForm": {
        const n = val("sg-n"), t = val("sg-t"), em = val("sg-e"), pw = $("#sg-p").value;
        if (!n) return fail("Indiquez votre nom."); if (!telOk(t)) return fail("Indiquez un téléphone valide."); if (!mailOk(em)) return fail("Adresse e-mail invalide."); if (pw.length < 8) return fail("Le mot de passe doit faire au moins 8 caractères.");
        btn.disabled = true; const cr = await createUserWithEmailAndPassword(auth, em, pw);
        await updateProfile(cr.user, { displayName: n });
        await setDoc(doc(db, "users", cr.user.uid), { nom: n, tel: t, email: em, role: "client", createdAt: serverTimestamp() });
        S.profile = { nom: n, tel: t, email: em, role: "client" };
        try { await sendEmailVerification(cr.user); } catch (er) { /* non bloquant */ }
        toast("Compte créé. Confirmez votre e-mail."); render(); break;
      }
      case "resetForm": { const em = val("rs-e"); if (!mailOk(em)) return fail("Adresse e-mail invalide."); btn.disabled = true; await sendPasswordResetEmail(auth, em); fail(""); toast("Lien envoyé à " + em); ctab = "connexion"; render(); break; }
      case "profilForm": { btn.disabled = true; const d = { nom: val("pc-n"), tel: val("pc-t"), commune: val("pc-c"), quartier: val("pc-q"), adresse: val("pc-a") }; await setDoc(doc(db, "users", S.user.uid), d, { merge: true }); S.profile = Object.assign({}, S.profile, d); btn.disabled = false; toast("Informations enregistrées"); break; }
      case "vendForm": {
        const d = { nom: val("in-n"), boutique: val("in-b"), tel: val("in-t"), wa: val("in-w"), desc: val("in-d") };
        const em = S.user ? S.user.email : val("in-e"), pw = S.user ? "" : $("#in-p").value;
        const err = !d.nom ? "Indiquez votre nom." : !d.boutique ? "Indiquez le nom de la boutique." : !telOk(d.tel) ? "Indiquez un téléphone valide." : !telOk(d.wa) ? "Indiquez un numéro WhatsApp valide." : !mailOk(em) ? "L'adresse e-mail n'est pas valide." : !S.user && pw.length < 8 ? "Le mot de passe doit faire au moins 8 caractères." : "";
        if (err) return fail(err);
        btn.disabled = true; btn.textContent = "Envoi…";
        const logo = await readImg(($("#in-l").files || [])[0], 300, .8);
        let user = S.user;
        if (!user) { const cr = await createUserWithEmailAndPassword(auth, em, pw); user = cr.user; await updateProfile(user, { displayName: d.nom }); try { await sendEmailVerification(user); } catch (er) { /* non bloquant */ } }
        await setDoc(doc(db, "users", user.uid), { nom: d.nom, tel: d.tel, email: em, role: "vendeur", createdAt: serverTimestamp() }, { merge: true });
        await setDoc(doc(db, "vendeurs", user.uid), Object.assign({}, d, { email: em, logo: logo || "", statut: "attente", createdAt: serverTimestamp() }));
        sendMail(contact().email, "Nouvelle demande de vendeur", "La boutique « " + d.boutique + " » (" + d.nom + ", " + d.tel + ", " + em + ") demande à vendre sur " + SITE.nom + ". Validez-la dans Administration > Vendeurs.");
        toast("Demande envoyée"); location.hash = "#vendeur"; render(); break;
      }
      case "vProfForm": {
        const d = { boutique: val("pf-b"), nom: val("pf-n"), wa: val("pf-w"), email: val("pf-e"), tel: val("pf-t"), desc: val("pf-d") };
        if (!d.boutique) return fail("Le nom de la boutique est obligatoire."); if (!telOk(d.wa)) return fail("Numéro WhatsApp invalide."); if (!mailOk(d.email)) return fail("L'adresse e-mail n'est pas valide.");
        btn.disabled = true; const logo = await readImg(($("#pf-l").files || [])[0], 300, .8); if (logo) d.logo = logo;
        await updateDoc(doc(db, "vendeurs", S.user.uid), Object.assign(d, { updatedAt: serverTimestamp() })); btn.disabled = false; toast("Profil enregistré"); journal("vendeur.profil", d.boutique); break;
      }
      case "prodForm": await saveProduct(btn); break;
      case "galForm": {
        const ti = val("ga-t"), files = [...($("#ga-i").files || [])]; if (!ti) return fail("Ajoutez un titre."); if (!files.length) return fail("Choisissez au moins une photo.");
        btn.disabled = true;
        for (let i = 0; i < files.length; i++) {
          btn.textContent = "Envoi " + (i + 1) + " / " + files.length + "…";
          const thumb = await readImg(files[i], 700, .78), hd = await readImg(files[i], 1600, .82);
          const ref = doc(collection(db, "galerie")), b = writeBatch(db);
          b.set(ref, { cat: val("ga-c"), album: val("ga-al"), titre: files.length > 1 ? ti + " (" + (i + 1) + ")" : ti, thumb, vedette: false, createdAt: serverTimestamp() });
          b.set(doc(db, "galerie_hd", ref.id), { image: hd }); await b.commit();
        }
        journal("galerie.ajout", files.length + " photo(s)"); toast(files.length + " photo(s) ajoutée(s)"); renderAdminForm(); break;
      }
      case "prestForm": {
        const d = { nom: val("xp-n"), prix: Math.max(0, Math.round(+val("xp-p") || 0)), duree: val("xp-d"), ordre: +val("xp-o") || 0, inclus: val("xp-i"), cat: val("xp-c") };
        if (!d.nom) return fail("Donnez un nom à la prestation."); btn.disabled = true;
        const im = await readImg(($("#xp-im").files || [])[0], 900, .78); if (im) d.image = im;
        if (xEdit) await updateDoc(doc(db, "prestations", xEdit), d); else await addDoc(collection(db, "prestations"), Object.assign(d, { createdAt: serverTimestamp() }));
        journal("prestation.enregistree", d.nom); toast("Prestation enregistrée"); xEdit = null; renderAdminForm(); break;
      }
      case "paramForm": {
        const cs = [...document.querySelectorAll("#catEdit input")].map(i => ({ id: i.dataset.cid || i.value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""), nom: i.value.trim() })).filter(c => c.nom && c.id);
        if (!cs.length) return fail("Gardez au moins une catégorie.");
        const em = val("pa-e"); if (em && !mailOk(em)) return fail("L'adresse e-mail n'est pas valide.");
        btn.disabled = true;
        await setDoc(doc(db, "parametres", "site"), { contact: { whatsapp: val("pa-w"), email: em, ville: val("pa-v"), instagram: val("pa-ig"), facebook: val("pa-fb"), tiktok: val("pa-tk") }, titre: val("pa-ti"), accroche: val("pa-ac"), citation: val("pa-ci"), apropos: val("pa-ap"), categories: cs, updatedAt: serverTimestamp() }, { merge: true });
        journal("parametres.modifies", ""); btn.disabled = false; toast("Paramètres enregistrés"); break;
      }
    }
  } catch (err) { console.error(err); fail(errMsg(err)); if (btn && /…$/.test(btn.textContent)) btn.textContent = "Réessayer"; }
});

counts(); footer();

</script>
